# Gateway configuration: the only port the Angular frontend talks to
server:
  port: 5000

spring:
  application:
    name: gateway
  cloud:
    gateway:
      server:
        webflux:
          # Add one route per service as you build it. Each route sends matching paths
          # to that service's port. Example for the Booking Engine:
          #
          #   - id: bookings
          #     uri: http://localhost:5003
          #     predicates:
          #       - Path=/api/bookings/**
          #
          # Ports: auth 5001 · catalog 5002 · bookings 5003 · notifications 5004
          routes: []
