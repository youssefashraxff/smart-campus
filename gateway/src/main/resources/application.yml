# Gateway configuration: the only port the Angular frontend talks to (FR-C1)
server:
  port: 5010

# Verifies the tokens AuthService signs. Must be the same secret as in services/auth-service; the real
# value goes in application-local.yml.
jwt:
  secret: CHANGE_ME

spring:
  application:
    name: gateway
  # Spring's own errors in the aggregation controllers (e.g. a missing ?from=) as ProblemDetail JSON too
  webflux:
    problemdetails:
      enabled: true
  # Git-ignored; copy application-local.yml.example. Never commit the real secret.
  config:
    import: optional:classpath:application-local.yml
  cloud:
    gateway:
      server:
        webflux:
          # CORS for the Angular dev server (FR-C4, NFR-5). Only this origin may call the API from a browser.
          # SecurityConfig reads these rules too, so that 401 and 403 answers also get the CORS headers.
          globalcors:
            # Also send the CORS headers when no route matches. Without them the browser hides the real
            # 404 and Angular only sees "status 0", which looks as if the gateway were down.
            add-to-simple-url-handler-mapping: true
            cors-configurations:
              "[/**]":
                allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
                allowed-methods: GET, POST, PUT, DELETE, OPTIONS
                allowed-headers: "*"

          # Retry a request while the target service is still starting. On Render's free tier every service
          # sleeps after 15 idle minutes and Render answers 502/503 for it. Calls from the gateway don't wake it;
          # the Angular app does that from the browser (frontend/src/app/core/wake-up.ts), and this covers the boot time.
          # Only those two statuses are retried, so a real error from a running service is returned at once.
          # Backoff 2s, 4s, 8s, 16s, then 20s each = ~110s in total (a Spring Boot service needs ~70s to boot there). Request bodies (e.g. login) are cached and resent.
          default-filters:
            - name: Retry
              args:
                retries: 8
                statuses: BAD_GATEWAY, SERVICE_UNAVAILABLE
                series:            # empty = not every 5xx, only the statuses above
                exceptions: java.net.ConnectException   # never resend after the service may have received it
                methods: GET, POST, PUT, DELETE
                backoff:
                  firstBackoff: 2s
                  maxBackoff: 20s
                  factor: 2
                  basedOnPreviousValue: true

          # One route per service (FR-C2). The ports match server.port in each service's application.yml.
          # Paths are forwarded unchanged (no StripPrefix), so the services' controllers use the same
          # /api/... paths as SRS section 5, e.g. @RequestMapping("/api/bookings").
          # "/api/facilities/**" also matches "/api/facilities" itself.
          routes:
            # services/auth-service (port 5001): register, login, current user
            - id: auth-service
              uri: ${AUTH_SERVICE_URL:http://localhost:5001}
              predicates:
                - Path=/api/auth/**

            # services/facility-catalog (port 5002): facilities, events, speakers
            - id: facility-catalog
              uri: ${CATALOG_SERVICE_URL:http://localhost:5002}
              predicates:
                - Path=/api/facilities/**, /api/events/**

            # services/booking-engine (port 5003): facility bookings and event registrations
            - id: booking-engine
              uri: ${BOOKING_SERVICE_URL:http://localhost:5003}
              predicates:
                - Path=/api/bookings/**, /api/registrations/**

            # services/notification-service (port 5004): user alerts
            - id: notification-service
              uri: ${NOTIFICATION_SERVICE_URL:http://localhost:5004}
              predicates:
                - Path=/api/notifications/**

            # services/chatbot-service (port 5005): Campus Assistant (bonus, FR-B1..B3)
            - id: chatbot-service
              uri: ${CHATBOT_SERVICE_URL:http://localhost:5005}
              predicates:
                - Path=/api/chat/**

          # Not routes: /api/dashboard and /api/facilities/{id}/availability are aggregated endpoints
          # (FR-C3) that the gateway answers itself in Java (package aggregation), by calling several services.

# Where the aggregation controllers find the services (DownstreamClients). Same ports as the routes above.
# ${NAME:default} = use the environment variable NAME if set (Render, see render.yaml), else the localhost default.
services:
  catalog-url: ${CATALOG_SERVICE_URL:http://localhost:5002}
  booking-url: ${BOOKING_SERVICE_URL:http://localhost:5003}
  notification-url: ${NOTIFICATION_SERVICE_URL:http://localhost:5004}
