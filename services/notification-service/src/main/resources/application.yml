# Notification Service configuration (C#: appsettings.json)
server:
  port: 5004

spring:
  application:
    name: notification-service
  # Your real database password goes in application-local.yml next to this file
  # (git-ignored; copy application-local.yml.example). Never commit it.
  config:
    import: optional:classpath:application-local.yml
  datasource:
    url: jdbc:postgresql://localhost:5432/campusdb
    username: postgres
    password: CHANGE_ME
  jpa:
    hibernate:
      # Flyway creates the tables; Hibernate only checks that the @Entity classes match them
      ddl-auto: validate
    open-in-view: false
  flyway:
    # Own history table per service, because all four services share campusdb
    table: flyway_history_notification
    # campusdb already has the other services' tables, so start the history from version 0
    baseline-on-migrate: true
    baseline-version: 0

# auth-service owns the users' email addresses (AuthClient)
services:
  auth-url: http://localhost:5001

# Email half of FR-U9 (EmailSender). Off by default: alerts are still saved, the email is only logged.
# To send real mail, set enabled: true and the spring.mail settings in application-local.yml
# (see application-local.yml.example).
notifications:
  email:
    enabled: false
    from: smart-campus@cis.asu.edu.eg
