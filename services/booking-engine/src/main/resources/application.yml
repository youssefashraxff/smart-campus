# Booking Engine configuration (C#: appsettings.json)
server:
  port: 5003

spring:
  application:
    name: booking-engine
  # Your real database password goes in application-local.yml next to this file
  # (git-ignored; copy application-local.yml.example). Never commit it.
  config:
    import: optional:classpath:application-local.yml
  datasource:
    url: jdbc:postgresql://localhost:5432/campusdb
    username: postgres
    password: CHANGE_ME
  jpa:
    hibernate:
      # Flyway creates the tables; Hibernate only checks that the @Entity classes match them
      ddl-auto: validate
    open-in-view: false
  flyway:
    # Own history table per service, because all four services share campusdb
    table: flyway_history_booking
    # campusdb already has the other services' tables, so start the history from version 0
    baseline-on-migrate: true
    baseline-version: 0

# Other services this one calls over HTTP (used in RestClientConfig)
services:
  catalog-url: http://localhost:5002
  notification-url: http://localhost:5004

# SRS 4.3.6 reminders (ReminderJob). ISO-8601 durations: PT5M = 5 minutes, PT24H = 24 hours.
reminders:
  lead-time: PT24H
  check-interval: PT5M
