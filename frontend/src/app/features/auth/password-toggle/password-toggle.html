<ng-content />
<!-- type="button": the default type would submit the form -->
<button
  type="button"
  class="text-muted-foreground hover:text-foreground focus-visible:ring-ring/50 absolute inset-y-0 end-0 flex w-11 items-center justify-center rounded-xl transition-colors outline-none focus-visible:ring-3"
  [attr.aria-label]="visible() ? 'Hide password' : 'Show password'"
  (click)="visible.set(!visible())"
>
  <ng-icon [name]="visible() ? 'lucideEyeOff' : 'lucideEye'" size="18" aria-hidden="true" />
</button>
